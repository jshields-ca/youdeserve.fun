<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Deserve Fun</title>

    <!-- Tailwind CSS - This is needed for layout, spacing, and responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Style Guide - This handles our unique colors, fonts, and component themes -->
    <style>
        /* --- You Deserve Fun - Style Guide v1.0 --- */

        /* 1. Font Imports */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Inter:wght@400;500&display=swap');

        /* 2. Color & Font Variables (CSS Custom Properties) */
        :root {
            --bg-main: #FDFBF6;
            --text-main: #0C120C;
            --text-heading: #6C698D;
            --accent-primary: #50C5B7;
            --accent-secondary: #F5D547;
            --accent-primary-hover: #40a093; /* A slightly darker teal */
            --accent-secondary-hover: #e0c240; /* A slightly darker yellow */
            --card-bg: #FFFFFF;
            --card-shadow: rgba(0, 0, 0, 0.08);

            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        /* 3. Global Styles */
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-body);
        }

        /* 4. Typography Styles */
        h1, h2, h3 {
            font-family: var(--font-heading);
            color: var(--text-heading);
        }

        /* 5. Component Styles */
        
        /* Main display card */
        #reason-display-container {
            background-color: var(--card-bg);
            box-shadow: 0 4px 15px var(--card-shadow);
            border: 1px solid #eee;
        }

        /* Submission form card */
        #submission-section {
            background-color: rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 15px var(--card-shadow);
        }

        /* Modal card */
        #message-modal .bg-white {
             box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        }

        /* 6. Button Styles */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-family: var(--font-body);
            transition: all 0.2s ease-in-out;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 5px var(--card-shadow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px var(--card-shadow);
        }

        .btn-primary {
            background-color: var(--accent-primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--accent-primary-hover);
        }

        .btn-secondary {
            background-color: var(--accent-secondary);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background-color: var(--accent-secondary-hover);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl mx-auto text-center">

        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-4xl md:text-5xl font-bold">You Deserve Fun.</h1>
            <p class="mt-2 text-lg text-gray-600">A small corner of the internet to share and remember why.</p>
        </header>

        <!-- Reason Display Section -->
        <main id="reason-display-container" class="p-6 md:p-8 min-h-[200px] flex items-center justify-center mb-8 rounded-xl transition-all duration-300">
            <div id="loader" class="loader"></div>
            <p id="reason-text" class="text-xl md:text-2xl leading-relaxed" style="display: none;"></p>
        </main>
        
        <!-- Action Buttons -->
        <div class="mb-10">
            <button id="another-reason-btn" class="btn btn-primary">
                Show Another Reason
            </button>
        </div>

        <!-- Submission Section -->
        <section id="submission-section" class="p-6 rounded-xl">
            <form id="reason-form">
                <label for="reason-input" class="block text-xl font-medium text-gray-700 mb-3">Why do you deserve fun today?</label>
                <textarea id="reason-input" name="reason" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400 transition" placeholder="I finished a tough project, I took a nice walk, I made someone smile..."></textarea>
                <button type="submit" id="submit-btn" class="mt-4 w-full btn btn-secondary flex items-center justify-center">
                    <span id="submit-btn-text">Share My Reason</span>
                </button>
            </form>
        </section>

        <!-- Footer -->
        <footer class="mt-12 text-sm text-gray-500">
            <p>Built with ❤️ in Winnipeg, MB. All reasons are shared anonymously.</p>
             <p class="mt-1">User ID: <span id="user-id-display"></span></p>
        </footer>

    </div>

    <!-- Generic Modal for Messages -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-xl p-8 text-center max-w-sm mx-auto">
            <h2 id="modal-title" class="text-2xl font-bold"></h2>
            <p id="modal-message" class="text-gray-700 my-4"></p>
            <button id="close-modal-btn" class="btn btn-primary">Close</button>
        </div>
    </div>

    <!-- Your JavaScript -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
