<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Deserve Fun</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Custom styles to complement Tailwind */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Fade-in animation for the reason card */
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Simple spinner for loading state */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Add a subtle animation for the submit button's spinner */
        .btn-spinner {
            display: inline-block;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            width: 1.25rem;
            height: 1.25rem;
            animation: spin 0.6s linear infinite;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body class="bg-amber-50 text-gray-800 flex flex-col min-h-screen items-center justify-center p-4">

    <div id="app" class="w-full max-w-2xl mx-auto text-center">

        <!-- Header Section -->
        <header class="mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-amber-800">You Deserve Fun.</h1>
            <p class="mt-2 text-lg text-gray-600">A small corner of the internet to share and remember why.</p>
        </header>

        <!-- Reason Display Section -->
        <main id="reason-display-container" class="bg-white rounded-xl shadow-lg p-6 md:p-8 min-h-[200px] flex items-center justify-center mb-8 transition-all duration-300">
            <div id="loader" class="loader"></div>
            <p id="reason-text" class="text-xl md:text-2xl text-gray-700 leading-relaxed" style="display: none;"></p>
        </main>
        
        <!-- Action Buttons -->
        <div class="mb-10">
            <button id="another-reason-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105">
                Show Another Reason
            </button>
        </div>

        <!-- Submission Section -->
        <section class="bg-white/60 backdrop-blur-sm p-6 rounded-xl shadow-md">
            <form id="reason-form">
                <label for="reason-input" class="block text-xl font-medium text-gray-700 mb-3">Why do you deserve fun today?</label>
                <textarea id="reason-input" name="reason" rows="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" placeholder="I finished a tough project, I took a nice walk, I made someone smile..."></textarea>
                <button type="submit" id="submit-btn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-transform transform hover:scale-105 flex items-center justify-center">
                    <span id="submit-btn-text">Share My Reason</span>
                </button>
            </form>
        </section>

        <!-- Footer -->
        <footer class="mt-12 text-gray-500 text-sm">
            <p>Built with ❤️ in Winnipeg, MB. All reasons are shared anonymously.</p>
             <p class="mt-1">User ID: <span id="user-id-display"></span></p>
        </footer>

    </div>

    <!-- Generic Modal for Messages -->
    <div id="message-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4" style="display: none;">
        <div class="bg-white rounded-xl shadow-2xl p-8 text-center max-w-sm mx-auto">
            <h2 id="modal-title" class="text-2xl font-bold text-amber-800 mb-4"></h2>
            <p id="modal-message" class="text-gray-700 mb-6"></p>
            <button id="close-modal-btn" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-5 rounded-lg">Close</button>
        </div>
    </div>

    <!-- Firebase App (V9) -->
    <script type="module">
        // Import necessary functions from Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "YOUR_API_KEY", authDomain: "YOUR_AUTH_DOMAIN", projectId: "YOUR_PROJECT_ID" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-fun-wall';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // --- App Initialization ---
        let app, db, auth, userId;
        let reasonsCache = [];
        let isFetching = false;

        // --- DOM Elements ---
        const loader = document.getElementById('loader');
        const reasonText = document.getElementById('reason-text');
        const anotherReasonBtn = document.getElementById('another-reason-btn');
        const reasonForm = document.getElementById('reason-form');
        const reasonInput = document.getElementById('reason-input');
        const submitBtn = document.getElementById('submit-btn');
        const submitBtnText = document.getElementById('submit-btn-text');
        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const userIdDisplay = document.getElementById('user-id-display');

        /**
         * Shows a modal with a custom title and message.
         * @param {string} title - The title for the modal.
         * @param {string} message - The message content for the modal.
         */
        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            messageModal.style.display = 'flex';
        }

        /**
         * Initializes Firebase and sets up authentication.
         */
        async function initializeFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                setLogLevel('debug');
                await authenticateUser();
            } catch (error) {
                console.error("Firebase initialization failed:", error);
                reasonText.textContent = "Could not connect to the Fun Wall. Please try again later.";
                loader.style.display = 'none';
                reasonText.style.display = 'block';
            }
        }

        /**
         * Authenticates the user either with a provided token or anonymously.
         */
        async function authenticateUser() {
             onAuthStateChanged(auth, async (user) => {
                if (user) {
                    userId = user.uid;
                    userIdDisplay.textContent = userId;
                    await fetchAndDisplayReasons();
                } else {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Authentication error:", error);
                        showModal("Authentication Error", "Could not authenticate. Please refresh the page.");
                    }
                }
            });
        }

        /**
         * Fetches all reasons from Firestore and stores them in a local cache.
         */
        async function fetchAndDisplayReasons() {
            if (isFetching || !db) return;
            isFetching = true;
            loader.style.display = 'block';
            reasonText.style.display = 'none';

            try {
                const reasonsCollection = collection(db, `/artifacts/${appId}/public/data/reasons`);
                const querySnapshot = await getDocs(reasonsCollection);
                reasonsCache = [];
                querySnapshot.forEach((doc) => {
                    reasonsCache.push(doc.data().reason);
                });
                displayRandomReason();
            } catch (error) {
                console.error("Error fetching reasons: ", error);
                reasonText.textContent = "Could not fetch reasons. Maybe you're the first to add one!";
            } finally {
                loader.style.display = 'none';
                reasonText.style.display = 'block';
                isFetching = false;
            }
        }
        
        /**
         * Displays a random reason from the cache.
         */
        function displayRandomReason() {
            if (reasonsCache.length === 0) {
                reasonText.textContent = "No reasons yet. Be the first to share why you deserve fun!";
                return;
            }
            const randomIndex = Math.floor(Math.random() * reasonsCache.length);
            const randomReason = reasonsCache[randomIndex];
            
            reasonText.classList.remove('fade-in');
            void reasonText.offsetWidth; 
            reasonText.textContent = `"${randomReason}"`;
            reasonText.classList.add('fade-in');
        }

        /**
         * Uses Gemini API to check if the submission is appropriate.
         * @param {string} text - The text to moderate.
         * @returns {Promise<boolean>} - True if safe, false otherwise.
         */
        async function isSubmissionSafe(text) {
            const apiKey = ""; // Will be handled by the environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

            const prompt = `You are a content moderator for a website called 'You Deserve Fun' where people post positive reasons why they deserve to have fun. Your task is to determine if a user's submission is safe and appropriate for a general audience. The submission should be positive, not offensive, not hateful, and not contain profanity or harmful content. Respond with only the single word 'SAFE' if the submission is appropriate, and 'UNSAFE' if it is not. Do not provide any explanation. Submission: "${text}"`;
            
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    console.error("Moderation API call failed with status:", response.status);
                    return false; // Fail closed (assume unsafe) if API fails
                }
                const result = await response.json();
                const moderationResult = result.candidates[0].content.parts[0].text.trim().toUpperCase();
                console.log("Moderation result:", moderationResult);
                return moderationResult === 'SAFE';
            } catch (error) {
                console.error("Error during moderation check:", error);
                return false; // Fail closed on error
            }
        }

        /**
         * Handles the submission process, including moderation.
         * @param {Event} e - The form submission event.
         */
        async function handleSubmission(e) {
            e.preventDefault();
            const reason = reasonInput.value.trim();
            if (reason.length < 5) {
                showModal("Hold on!", "Please share a little more in your reason.");
                return;
            }
            if (!db) {
                showModal("Error", "Database not connected. Please try again later.");
                return;
            }

            // --- Start loading state ---
            submitBtn.disabled = true;
            submitBtnText.innerHTML = '<span class="btn-spinner"></span>Checking...';

            // --- Moderation Check ---
            const safe = await isSubmissionSafe(reason);

            if (!safe) {
                showModal("Content Warning", "This submission doesn't seem to fit our positive community guidelines. Please try again with a different reason.");
                submitBtn.disabled = false;
                submitBtnText.innerHTML = 'Share My Reason';
                return;
            }

            // --- If safe, proceed to add to Firestore ---
            submitBtnText.innerHTML = '<span class="btn-spinner"></span>Sharing...';
            try {
                const reasonsCollection = collection(db, `/artifacts/${appId}/public/data/reasons`);
                await addDoc(reasonsCollection, {
                    reason: reason,
                    createdAt: serverTimestamp(),
                    authorId: userId
                });
                
                reasonsCache.push(reason);
                reasonInput.value = '';
                showModal("Thank You!", "Your reason has been added to the wall for others to see. We hope it brightens someone's day.");

            } catch (error) {
                console.error("Error adding document: ", error);
                showModal("Error", "Sorry, we couldn't save your reason. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitBtnText.innerHTML = 'Share My Reason';
            }
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', initializeFirebase);
        anotherReasonBtn.addEventListener('click', displayRandomReason);
        reasonForm.addEventListener('submit', handleSubmission);
        closeModalBtn.addEventListener('click', () => {
            messageModal.style.display = 'none';
        });

    </script>
</body>
</html>
